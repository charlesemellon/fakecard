<body>

<header>

    <h1>🧾 Fake Cash Register</h1>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    set,
    push,
    update,
    remove,
    get,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/*
    ========================================================
    PUT YOUR FIREBASE CONFIG HERE
    ========================================================

    Firebase Console:
    Project Settings
    -> Your apps
    -> Web app

    Copy the firebaseConfig object here.
*/

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
        "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


const firebaseApp =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(firebaseApp);

const db =
    getDatabase(firebaseApp);


/* =========================================================
   STATE
========================================================= */

let products = [];

let cards = [];

let transactions = [];

let cart = [];

let currentCard = null;

let selectedTransferCard = null;

let selectedTipPercent = 0;

let customTip = 0;

let selectedQRs = new Set();

let qrScanner = null;

let scannerLocked = false;

let currentUser = null;

let dataReady = false;


/* =========================================================
   CONSTANTS
========================================================= */

const TAX_RATE = 0.08;


/* =========================================================
   DEFAULT DATA
========================================================= */

const DEFAULT_PRODUCTS = {

    product1: {
        name: "Apple",
        price: 1.50
    },

    product2: {
        name: "Cookie",
        price: 2.00
    },

    product3: {
        name: "Juice",
        price: 2.50
    },

    product4: {
        name: "Sandwich",
        price: 5.00
    },

    product5: {
        name: "Toy",
        price: 7.50
    }
};

const DEFAULT_CARDS = {

    card1: {
        name: "Green Card",
        code: "CARD-GREEN-001",
        balance: 25,
        pinHash: null
    },

    card2: {
        name: "Blue Card",
        code: "CARD-BLUE-001",
        balance: 40,
        pinHash: null
    },

    card3: {
        name: "Purple Card",
        code: "CARD-PURPLE-001",
        balance: 15,
        pinHash: null
    },

    card4: {
        name: "Light Blue Card",
        code: "CARD-CYAN-001",
        balance: 30,
        pinHash: null
    }
};


/* =========================================================
   HELPERS
========================================================= */

function money(value) {

    return "$" +
        Number(value || 0)
            .toFixed(2);
}


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function normalizeQR(value) {

    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[^A-Z0-9]/g, "");
}


function getSubtotal() {

    return cart.reduce(
        (total, item) => {

            const product =
                products.find(
                    p =>
                        p.id ===
                        item.productId
                );

            if (!product)
                return total;

            return total +
                Number(product.price) *
                Number(item.quantity);

        },
        0
    );
}


function getTip() {

    const subtotal =
        getSubtotal();

    if (selectedTipPercent > 0) {

        return subtotal *
            selectedTipPercent /
            100;
    }

    return Number(customTip) || 0;
}


function getPreTaxTotal() {

    return getSubtotal() +
        getTip();
}


function getTaxAmount() {

    return getPreTaxTotal() *
        TAX_RATE;
}


function getFinalTotal() {

    return getPreTaxTotal() +
        getTaxAmount();
}


/* =========================================================
   PIN
========================================================= */

async function hashPIN(pin) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(pin);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(hashBuffer)
    )
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");
}


async function checkPIN(card, pin) {

    if (
        !card ||
        !card.pinHash
    ) {
        return false;
    }

    const enteredHash =
        await hashPIN(pin);

    return enteredHash ===
        card.pinHash;
}


function validPIN(pin) {

    return /^\d{4}$/.test(pin);
}


/* =========================================================
   FIREBASE DATA LISTENERS
========================================================= */

function startRealtimeListeners() {

    onValue(
        ref(db, "products"),
        snapshot => {

            const data =
                snapshot.val() || {};

            products =
                Object.entries(data)
                    .map(
                        ([id, product]) => ({
                            id,
                            ...product
                        })
                    );

            dataReady = true;

            refreshCurrentScreen();
        }
    );


    onValue(
        ref(db, "cards"),
        snapshot => {

            const data =
                snapshot.val() || {};

            cards =
                Object.entries(data)
                    .map(
                        ([id, card]) => ({
                            id,
                            ...card
                        })
                    );

            dataReady = true;

            if (
                currentCard &&
                cards.some(
                    card =>
                        card.id ===
                        currentCard.id
                )
            ) {

                currentCard =
                    cards.find(
                        card =>
                            card.id ===
                            currentCard.id
                    );
            }

            refreshCurrentScreen();
        }
    );


    onValue(
        ref(db, "transactions"),
        snapshot => {

            const data =
                snapshot.val() || {};

            transactions =
                Object.entries(data)
                    .map(
                        ([id, transaction]) => ({
                            id,
                            ...transaction
                        })
                    )
                    .sort(
                        (a, b) =>
                            Number(b.timestamp || 0) -
                            Number(a.timestamp || 0)
                    );

            refreshCurrentScreen();
        }
    );
}


/* =========================================================
   INITIALIZE DATABASE
========================================================= */

async function initializeDatabase() {

    const productsSnapshot =
        await get(
            ref(db, "products")
        );

    if (!productsSnapshot.exists()) {

        await set(
            ref(db, "products"),
            DEFAULT_PRODUCTS
        );
    }


    const cardsSnapshot =
        await get(
            ref(db, "cards")
        );

    if (!cardsSnapshot.exists()) {

        await set(
            ref(db, "cards"),
            DEFAULT_CARDS
        );
    }
}


/* =========================================================
   CONNECTION
========================================================= */

function updateConnectionStatus(
    connected
) {

    const element =
        document.getElementById(
            "connectionStatus"
        );

    if (!element)
        return;

    if (connected) {

        element.textContent =
            "● LIVE — Shared Register Connected";

        element.className =
            "connected";

    } else {

        element.textContent =
            "● OFFLINE — Waiting for connection";

        element.className =
            "disconnected";
    }
}


onValue(
    ref(db, ".info/connected"),
    snapshot => {

        updateConnectionStatus(
            snapshot.val() === true
        );
    }
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user)
            return;

        currentUser =
            user;

        document.getElementById(
            "userIdDisplay"
        ).textContent =
            "Register user: " +
            user.uid;

        await initializeDatabase();

        startRealtimeListeners();

        showMenu();
    }
);


signInAnonymously(auth)
    .catch(error => {

        console.error(error);

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="screen">

                <h2>
                    Firebase Login Error
                </h2>

                <div class="warning">

                    ${escapeHTML(
                        error.message
                    )}

                </div>

                <p>
                    Check your Firebase
                    configuration and make sure
                    Anonymous Authentication is enabled.
                </p>

            </div>
        `;
    });


/* =========================================================
   SCREEN REFRESH
========================================================= */

function refreshCurrentScreen() {

    /*
        Re-render only lightweight screens.
        Never automatically rerender a form that
        somebody is typing into.
    */

    const title =
        document.querySelector(
            "#app h2"
        );

    if (!title)
        return;

    const text =
        title.textContent;

    if (
        text.includes("View Balances")
    ) {

        balanceScreen();

    } else if (
        text.includes("Transaction History")
    ) {

        historyScreen();
    }
}


/* =========================================================
   MAIN MENU
========================================================= */

function showMenu() {

    stopQRScanner();

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <h2>

function addItem(productId) {

    const existing =
        cart.find(
            item =>
                item.productId ===
                productId
        );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            productId,

            quantity: 1

        });
    }

    productSelection();
}


function changeItem(
    productId,
    amount
) {

    const item =
        cart.find(
            item =>
                item.productId ===
                productId
        );

    if (!item)
        return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(
                item =>
                    item.productId !==
                    productId
            );
    }

    productSelection();
}


function clearSale() {

    if (cart.length === 0)
        return;

    if (!confirm(
        "Clear all items from this sale?"
    ))
        return;

    cart = [];

    selectedTipPercent = 0;

    customTip = 0;

    productSelection();
}

async function startQRScanner() {

    if (scannerLocked)
        return;

    stopQRScanner();

    const reader =
        document.getElementById(
            "qr-reader"
        );

    if (!reader)
        return;

    const status =
        document.getElementById(
            "scanStatus"
        );

    status.textContent =
        "Starting camera...";

    qrScanner =
        new Html5Qrcode(
            "qr-reader"
        );

    try {

        const cameras =
            await Html5Qrcode.getCameras();

        if (
            !cameras ||
            cameras.length === 0
        ) {

            status.textContent =
                "No camera found. Use the manual code.";

            status.className =
                "scan-status scan-error";

            return;
        }

        let cameraId =
            cameras[0].id;

        const backCamera =
            cameras.find(
                camera =>
                    /back|rear|environment/i
                        .test(
                            camera.label
                        )
            );

        if (backCamera) {

            cameraId =
                backCamera.id;
        }

        await qrScanner.start(

            cameraId,

            {
                fps: 10,

                qrbox:
                    function(
                        width,
                        height
                    ) {

                        const size =
                            Math.min(
                                width,
                                height
                            ) * .70;

                        return {

                            width:
                                Math.floor(size),

                            height:
                                Math.floor(size)
                        };
                    },

                aspectRatio: 1
            },

            decodedText => {

                handleScannedCode(
                    decodedText
                );
            },

            () => {}

        );

        status.textContent =
            "📷 Point the camera at the card QR code.";

    } catch(error) {

        console.error(error);

        status.textContent =
            "Camera could not start. Allow camera access or use the manual code.";

        status.className =
            "scan-status scan-error";
    }
}


function stopQRScanner() {

    if (!qrScanner)
        return;

    try {

        qrScanner.stop()
            .then(() => {

                try {
                    qrScanner.clear();
                } catch(e) {}

                qrScanner = null;

            })
            .catch(() => {

                qrScanner = null;

            });

    } catch(e) {

        qrScanner = null;
    }
}


function handleScannedCode(
    decodedText
) {

    if (scannerLocked)
        return;

    scannerLocked = true;

    stopQRScanner();

    findCard(decodedText);
}


function manualScan() {

    const input =
        document.getElementById(
            "manualCode"
        );

    const code =
        input.value.trim();

    if (!code) {

        alert(
            "Enter a card code."
        );

        return;
    }

    scannerLocked = true;

    stopQRScanner();

    findCard(code);
}


async function scanImageInstead() {

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";

    input.accept = "image/*";

    input.onchange =
        async function() {

            if (!input.files.length)
                return;

            try {

                const scanner =
                    new Html5Qrcode(
                        "qr-reader"
                    );

                const decodedText =
                    await scanner.scanFile(
                        input.files[0],
                        true
                    );

                scanner.clear();

                handleScannedCode(
                    decodedText
                );

            } catch(error) {

                alert(
                    "I couldn't find a QR code in that picture."
                );
            }
        };

    input.click();
}


/* =========================================================
   FIND CARD
========================================================= */

function findCard(decodedText) {

    const raw =
        String(decodedText || "")
            .trim();

    const normalized =
        normalizeQR(raw);

    let card =
        cards.find(
            card =>
                normalizeQR(
                    card.code
                ) === normalized
        );

    if (!card) {

        card =
            cards.find(
                card =>
                    normalizeQR(
                        card.name
                    ) === normalized
            );
    }

    if (!card) {

        try {

            const url =
                new URL(raw);

            const values = [

                url.searchParams.get("card"),

                url.searchParams.get("code"),

                url.searchParams.get("id")
            ];

            for (
                const value of values
            ) {

                if (!value)
                    continue;

                const normalizedValue =
                    normalizeQR(value);

                card =
                    cards.find(
                        c =>
                            normalizeQR(
                                c.code
                            ) ===
                            normalizedValue
                    );

                if (card)
                    break;
            }

        } catch(e) {}
    }

    if (!card) {

        scannerLocked = false;

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="screen">

                <h2>
                    ❌ Card Not Found
                </h2>

                <div class="card-box">

                    <strong>
                        QR data:
                    </strong>

                    <br><br>

                    <code>
                        ${escapeHTML(raw)}
                    </code>

                </div>

                <button
                    class="primary full"
                    onclick="showCardScanner()">

                    ← Scan Again

                </button>

            </div>
        `;

        return;
    }

    currentCard =
        card;

    cardPINScreen();
}

async function verifyChargePIN() {

        document.getElementById(
            "chargePIN"
        ).value;

    if (!validPIN(pin)) {

        alert(
            "Enter the 4-digit PIN."
        );

        return;
    }

    /*

        a PIN. Give them the option to
        create one.
    */

    if (!currentCard.pinHash) {

        setupExistingCardPIN(
            currentCard
        );

        return;

    const correct =
        await checkPIN(
            currentCard,
            pin
        );

    if (!correct) {

        alert(
            "Incorrect PIN."
        );

        document.getElementById(
            "chargePIN"
        ).value = "";

        return;

    paymentReview();

async function saveExistingCardPIN(id) {

    const pin =
        document.getElementById(
            "newExistingPIN"
        ).value;

    const confirmPIN =
        document.getElementById(
            "confirmExistingPIN"
        ).value;

    if (!validPIN(pin)) {

        alert(
            "PIN must be exactly 4 digits."
        );

        return;
    }

    if (pin !== confirmPIN) {

        alert(
            "The PINs don't match."
        );

        return;
    }

    const pinHash =
        await hashPIN(pin);

    await update(
        ref(db, "cards/" + id),
        {
            pinHash
        }
    );

    currentCard =
        cards.find(
            card =>
                card.id === id
        );

    alert(
        "PIN created successfully."
    );

    cardPINScreen();
}

    if (!currentCard)
        return;

    const total =
        Number(
            getFinalTotal()
        );

    const cardRef =
        ref(
            db,
            "cards/" +
            currentCard.id +
            "/balance"
        );

    let transactionResult;

    try {

        transactionResult =
            await runTransaction(
                cardRef,
                currentBalance => {

                    const balance =
                        Number(
                            currentBalance || 0
                        );

                    if (balance < total) {

                        return;
                    }

                    return balance - total;
                }
            );

    } catch(error) {

        console.error(error);

        alert(
            "The payment could not be completed."
        );

        return;
    }

    if (
        !transactionResult.committed
    ) {

        alert(
            "Not enough balance. Another user may have just spent some of this card's money."
        );

        currentCard =
            cards.find(
                card =>
                    card.id ===
                    currentCard.id
            );

        cardPINScreen();

        return;
    }

    transferScreen();
}

========================================================= */

async function transferMoney(
    recipientId
) {

    const recipient =
        cards.find(
            card =>
                card.id ===
                recipientId
        );

    if (!recipient)
        return;

    const amount =
        getPreTaxTotal();

    /*
        The buyer already paid the 8% tax.

        Only the pre-tax transaction amount
        goes to the recipient.
    */

    const recipientRef =
        ref(
            db,
            "cards/" +
            recipientId +
            "/balance"
        );

    try {

        await runTransaction(
            recipientRef,
            currentBalance => {

                return Number(
                    currentBalance || 0
                ) + amount;
            }
        );

    } catch(error) {

        console.error(error);

        alert(
            "The transfer could not be completed."
        );

        return;
    }

    await createTransaction(
        recipient
    );

    finishScreen(
        getFinalTotal(),
        recipient
    );
}


async function transferToNoOne() {

    await createTransaction(
        null
    );

    finishScreen(
        getFinalTotal(),
        null
    );
}

========================================================= */

async function createTransaction(
    recipient
) {

    const transactionRef =
        push(
            ref(db, "transactions")
        );

    const transaction = {

        customerCard:
            currentCard.name,

        customerCode:
            currentCard.code,

        subtotal:
            getSubtotal(),

        tip:
            getTip(),

        buyerTax:
            getTaxAmount(),

        amount:
            getFinalTotal(),

        recipient:
            recipient
            ? recipient.name
            : null,

        recipientAmount:
            recipient
            ? getPreTaxTotal()
            : null,

        timestamp:
            Date.now(),

        time:
            new Date()
                .toLocaleString(),

        createdBy:
            currentUser
            ? currentUser.uid
            : "unknown",

        items:
            cart.map(
                item => {

                    const product =
                        products.find(
                            p =>
                                p.id ===
                                item.productId
                        );

                    return {

                        name:
                            product
                            ? product.name
                            : "Unknown",

                        quantity:
                            item.quantity
                    };
                }
            )
    };

    await set(
        transactionRef,
        transaction
    );
}

async function createCard() {

async function saveChangedPIN(id) {

    const card =
        cards.find(
            c =>
                c.id === id
        );

    const oldPIN =
        document.getElementById(
            "oldPIN"
        ).value;

    const newPIN =
        document.getElementById(
            "newPIN"
        ).value;

    const confirmPIN =
        document.getElementById(
            "confirmPIN"
        ).value;

    if (
        !validPIN(oldPIN) ||
        !validPIN(newPIN)
    ) {

        alert(
            "PINs must be exactly 4 digits."
        );

        return;
    }

    if (
        card.pinHash
    ) {

        const oldCorrect =
            await checkPIN(
                card,
                oldPIN
            );

        if (!oldCorrect) {

            alert(
                "Current PIN is incorrect."
            );

            return;
        }
    }

    if (newPIN !== confirmPIN) {

        alert(
            "New PINs don't match."
        );

        return;
    }

    const pinHash =
        await hashPIN(newPIN);

    await update(
        ref(
            db,
            "cards/" + id
        ),
        {
            pinHash
        }
    );

    alert(
        "PIN changed successfully."
    );

    editCardScreen();
}

function toggleQR(id) {

    const checkbox =
        document.querySelector(
            `input[type="checkbox"][value="${id}"]`
        );

    if (!checkbox)
        return;

    if (checkbox.checked) {

        selectedQRs.add(id);

    } else {

        selectedQRs.delete(id);
    }

    updateQRVisual(id);

    updateSelectedCount();
}


function updateQRVisual(id) {

    const element =
        document.getElementById(
            "qr-select-" +
            id
        );

    if (!element)
        return;

    const checkbox =
        element.querySelector(
            "input"
        );

    element.classList.toggle(
        "selected",
        checkbox.checked
    );
}


function selectAllQRs() {

    selectedQRs =
        new Set(
            cards.map(
                card =>
                    card.id
            )
        );

    document
        .querySelectorAll(
            "#qrSelectionList input"
        )
        .forEach(
            checkbox =>
                checkbox.checked =
                    true
        );

    cards.forEach(
        card =>
            updateQRVisual(
                card.id
            )
    );

    updateSelectedCount();
}


function deselectAllQRs() {

    selectedQRs =
        new Set();

    document
        .querySelectorAll(
            "#qrSelectionList input"
        )
        .forEach(
            checkbox =>
                checkbox.checked =
                    false
        );

    cards.forEach(

    updateSelectedCount();
}


function updateSelectedCount() {

    const element =
        document.getElementById(
            "selectedCount"

    if (!element)

    const count =
        selectedQRs.size;

    element.textContent =
        count +

        );

    const selectedCards =
        cards.filter(
            card =>
                selectedQRs.has(
                    card.id
                )
        );

    printArea.innerHTML = "";

    const sheet =
        document.createElement(
            "div"
        );

    sheet.className =
        "print-sheet";

    printArea.appendChild(
        sheet
    );

    selectedCards.forEach(
        card => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "print-card";

            element.id =
                "print-qr-" +
                card.id;

            sheet.appendChild(
                element
            );
        }
    );

    selectedCards.forEach(
        card => {

            const container =
                document.getElementById(
                    "print-qr-" +
                    card.id
                );

            new QRCode(
                container,
                {

                    text:
                        card.code,

                    width:
                        500,

                    height:
                        500,

                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );
        }
    );

    let attempts = 0;

    function waitForQRCodes() {

        attempts++;

        const qrElements =
            printArea.querySelectorAll(
                ".print-card canvas, .print-card img"
            );

        if (
            qrElements.length ===
            selectedCards.length
        ) {

            requestAnimationFrame(
                () => {

                    requestAnimationFrame(
                        () => {

                            window.print();

                        }
                    );

                }
            );

            return;
        }

        if (attempts >= 50) {

            alert(
                "The QR codes took too long to generate."
            );

            return;
        }

        setTimeout(
            waitForQRCodes,
            100
        );
    }

    waitForQRCodes();
}

function addProductScreen() {

                type="number"

                Add Product

            </button>

    `;
}


async function addProduct() {

    const name =
        document.getElementById(
            "productName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );

    if (
        !name ||
        !Number.isFinite(price) ||
        price < 0
    ) {

        alert(
            "Enter a valid product."
        );

        return;
    }

    const productRef =
        push(
            ref(db, "products")
        );

    await set(
        productRef,
        {

            name,

            price
        }
    );

    alert(
        "Product added!"
    );

    productMenu();
}


function editProductsScreen() {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <button
                class="gray back"
                onclick="productMenu()">

                ← Product Menu

            </button>

            <h2>
                Edit Products
            </h2>

            ${
                products.length === 0

                ?

                `<div class="empty">
                    No products yet.
                </div>`

                :

                products.map(
                    product => `

                        <div class="option">

                            <strong>
                                ${escapeHTML(
                                    product.name

                            </strong>

                            <br><br>

                            ${money(
                                product.price

                            <br><br>

                            <button
                                class="primary"
                                onclick="
                                    editProduct(
                                        '${product.id}'
                                    )
                                ">

                                Edit

                            </button>

                            <button
                                class="red"
                                onclick="
                                    deleteProduct(
                                        '${product.id}'
                                    )

                                Delete

                            </button>

                        </div>
                    `
                ).join("")

    `;
}


function editProduct(id) {

    const product =
        products.find(
            product =>
                product.id === id
        );

    if (!product)
        return;

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <button
                class="gray back"
                onclick="
                    editProductsScreen()
                ">

                ← Products

            </button>

            <h2>
                Edit Product
            </h2>

            <label>
                Name
            </label>

            <input
                id="editProductName"
                value="${escapeHTML(
                    product.name
                )}">

            <label>
                Price
            </label>

            <input
                id="editProductPrice"
                type="number"
                step=".01"
                value="${product.price}">

            <button
                class="primary full"
                onclick="
                    saveProduct(
                        '${id}'
                    )
                ">

                Save

            </button>

        </div>
    `;
}


async function saveProduct(id) {

    const name =
        document.getElementById(
            "editProductName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "editProductPrice"
            ).value
        );

    if (
        !name ||
        !Number.isFinite(price) ||
        price < 0
    ) {

        alert(
            "Enter a valid product."
        );

        return;
    }

    await update(
        ref(
            db,
            "products/" + id
        ),
        {

            name,

            price
        }
    );

    editProductsScreen();
}


async function deleteProduct(id) {

    if (!confirm(
        "Delete this product?"
    ))
        return;

    await remove(
        ref(
            db,
            "products/" + id
        )
    );

    editProductsScreen();
}

                transactions.length === 0

                    No transactions yet.
                </div>`

                :

                transactions.map(
                    transaction => `

                        <div class="history">

                            <strong>
                                ${escapeHTML(
                                    transaction.customerCard
                                )}
                            </strong>

                            <br>

                            ${escapeHTML(
                                transaction.time
                            )}

                            <br><br>

                            Subtotal:
                            ${money(
                                transaction.subtotal
                            )}

                            <br>

                            Tip:
                            ${money(
                                transaction.tip
                            )}

                            <br>

                            Buyer tax (8%):
                            ${money(
                                transaction.buyerTax
                            )}

                            <br>

                            <strong>
                                Total charged:
                                ${money(
                                    transaction.amount
                                )}
                            </strong>

                            <br><br>

                            Money went to:

                            <strong>
                                ${
                                    transaction.recipient
                                    ?
                                    escapeHTML(
                                        transaction.recipient
                                    )
                                    :
                                    "No one"
                                }
                            </strong>

                            ${
                                transaction.recipientAmount !== null &&
                                transaction.recipientAmount !== undefined

                                `
                                <br>

                                Recipient received:
                                ${money(
                                    transaction.recipientAmount
                                )}
                                `

                                :

                                ""
                            }

                            <br><br>

                            <strong>
                                Items:
                            </strong>

                            <br>

                            ${
                                Array.isArray(
                                    transaction.items
                                )

                                ?

                                transaction.items
                                    .map(
                                        item =>
                                            `${escapeHTML(
                                                item.name
                                            )}
                                            ×
                                            ${item.quantity}`
                                    )
                                    .join("<br>")

                                :

                                ""
                            }

                            <br>

                            <small>
                                Created by:
                                ${escapeHTML(
                                    transaction.createdBy || ""
                                )}
                            </small>

                            <br><br>

                            <button
                                class="red full"
                                onclick="
                                    deleteTransaction(
                                        '${transaction.id}'
                                    )
                                ">

                                🗑 Delete This Transaction

                            </button>

                        </div>
                    `
                ).join("")
            }

            ${
                transactions.length > 0

                ?

                `

                <br>

                <button
                    class="red full"
                    onclick="
                        clearHistory()
                    ">

                    🗑 Delete ALL Transactions

                </button>

                `

                :

                ""
            }

        </div>
    `;
}


async function deleteTransaction(id) {

    if (!confirm(
        "Delete this transaction from history?"
    ))
        return;

    await remove(
        ref(
            db,
            "transactions/" + id
        )
    );

    historyScreen();
}


async function clearHistory() {

    if (!confirm(
        "Delete ALL fake transaction history?"
    ))
        return;

    await set(
        ref(db, "transactions"),
        null
    );

    historyScreen();
}
