<body>

<header>
    <h1>🧾 Fake Cash Register</h1>
    <span class="fake-label">PRETEND MONEY ONLY</span>
</header>

<div id="app"></div>

<div id="printArea"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://vzbniexghluuqwtgxwii.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_AF_6QkPOP6OBPCANPhhTEw_h5-HpMGJ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   DATA
========================================================= */

const defaultProducts = [
    {id: 1, name: "Apple", price: 1.50},
    {id: 2, name: "Cookie", price: 2.00},
    {id: 3, name: "Juice", price: 2.50},
    {id: 4, name: "Sandwich", price: 5.00},
    {id: 5, name: "Toy", price: 7.50}
];

const defaultCards = [
    {
        id: 1,
        name: "Green Card",
        code: "CARD-GREEN-001",
        balance: 25,
        pinHash: null,
        taxed: true
    },
    {
        id: 2,
        name: "Blue Card",
        code: "CARD-BLUE-001",
        balance: 40,
        pinHash: null,
        taxed: true
    },
    {
        id: 3,
        name: "Purple Card",
        code: "CARD-PURPLE-001",
        balance: 15,
        pinHash: null,
        taxed: true
    },
    {
        id: 4,
        name: "Light Blue Card",
        code: "CARD-CYAN-001",
        balance: 30,
        pinHash: null,
        taxed: true
    }
];

let products = [];
let cards = [];
let transactions = [];

let cart = [];

let currentCard = null;

let selectedTransferCard = null;
let transferChoice = null;

let selectedTipPercent = 0;
let customTip = 0;

/*
    NEW:
    Tax is controlled per transaction.

    true = normal 8% tax
    false = no tax
*/
let transactionTaxEnabled = true;

/*
    Custom checkout items get IDs starting at -1,
    -2, etc. so they don't conflict with products.
*/
let nextCustomItemId = -1;

let selectedQRs = new Set();

let qrScanner = null;
let scannerLocked = false;

let currentView = "menu";


/* =========================================================
   STORAGE
========================================================= */

async function loadData() {

    const { data, error } =
        await supabaseClient
            .from("cash_register_state")
            .select("*")
            .eq("id", 1)
            .maybeSingle();

    if (error) {

        console.error(
            "Supabase load error:",
            error
        );

        alert(
            "Could not load data from Supabase. " +
            "Check your table and RLS policies."
        );

        return false;
    }

    if (!data) {

        products =
            structuredClone(
                defaultProducts
            );

        cards =
            structuredClone(
                defaultCards
            );

        transactions = [];

        return await save();
    }

    products =
        Array.isArray(data.products)
        ? data.products
        : structuredClone(
            defaultProducts
        );

    cards =
        Array.isArray(data.cards)
        ? data.cards
        : structuredClone(
            defaultCards
        );

    transactions =
        Array.isArray(data.transactions)
        ? data.transactions
        : [];

    cards.forEach(card => {

        if (
            typeof card.taxed !==
            "boolean"
        ) {
            card.taxed = true;
        }

    });

    return true;
}

async function save() {

    const { error } =
        await supabaseClient
            .from("cash_register_state")
            .upsert(
                {
                    id: 1,
                    products,
                    cards,
                    transactions,
                    updated_at:
                        new Date().toISOString()
                },
                {
                    onConflict: "id"
                }
            );

    if (error) {

        console.error(
            "Supabase save error:",
            error
        );

        alert(
            "Could not save to Supabase: " +
            error.message
        );

        return false;
    }

    return true;
}


/* =========================================================
   REALTIME
========================================================= */

function applyRemoteState(data) {

    products =
        Array.isArray(data.products)
        ? data.products
        : [];

    cards =
        Array.isArray(data.cards)
        ? data.cards
        : [];

    transactions =
        Array.isArray(data.transactions)
        ? data.transactions
        : [];

    cards.forEach(card => {

        if (
            typeof card.taxed !==
            "boolean"
        ) {
            card.taxed = true;
        }

    });

    if (currentCard) {

        currentCard =
            cards.find(
                card =>
                    card.id ===
                    currentCard.id
            ) || null;
    }

    if (
        selectedTransferCard !==
        null
    ) {

        const stillExists =
            cards.some(
                card =>
                    card.id ===
                    selectedTransferCard
            );

        if (!stillExists) {

            selectedTransferCard =
                null;
        }
    }
}

function refreshCurrentView() {

    switch (currentView) {

        case "menu":
            showMenu();
            break;

        case "cardMenu":
            cardMenu();
            break;

        case "addMoney":
            addMoneyScreen();
            break;

        case "qr":
            qrScreen();
            break;

        case "productMenu":
            productMenu();
            break;

        case "editProducts":
            editProductsScreen();
            break;

        case "history":
            historyScreen();
            break;

        case "balances":
            balanceScreen();
            break;

        case "checkout":
            /*
                DO NOT refresh checkout.
                This prevents Realtime from destroying
                an item/custom-price entry currently
                being entered.
            */
            break;
    }
}

function startRealtimeUpdates() {

    supabaseClient
        .channel(
            "cash-register-state-changes"
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table:
                    "cash_register_state",
                filter:
                    "id=eq.1"
            },
            payload => {

                if (!payload.new)
                    return;

                applyRemoteState(
                    payload.new
                );

                refreshCurrentView();
            }
        )
        .subscribe(status => {

            console.log(
                "Supabase Realtime:",
                status
            );
        });
}


/* =========================================================
   HELPERS
========================================================= */

function money(value) {

    return "$" +
        Number(value).toFixed(2);
}

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function normalizeQR(value) {

    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[^A-Z0-9]/g, "");
}


/* =========================================================
   CART HELPERS
========================================================= */

/*
    Normal products live in products[].

    Custom items live directly inside cart:
    {
        productId: negative number,
        custom: true,
        name: "...",
        price: 5,
        quantity: 1
    }
*/

function getCartItemInfo(item) {

    if (item.custom) {

        return {
            name:
                item.name ||
                "Custom Item",

            price:
                Number(item.price) || 0
        };
    }

    const product =
        products.find(
            p =>
                p.id ===
                item.productId
        );

    if (!product) {

        return {
            name: "Unknown Item",
            price: 0
        };
    }

    return {
        name: product.name,
        price: Number(product.price) || 0
    };
}

function getSubtotal() {

    return cart.reduce(
        (total, item) => {

            const info =
                getCartItemInfo(
                    item
                );

            return total +
                info.price *
                item.quantity;

        },
        0
    );
}

function getTip() {

    const subtotal =
        getSubtotal();

    if (
        selectedTipPercent >
        0
    ) {

        return subtotal *
            selectedTipPercent /
            100;
    }

    return Number(customTip) || 0;
}


/* =========================================================
   NEW TAX HELPERS
========================================================= */

function getTaxRate() {

    return transactionTaxEnabled
        ? 0.08
        : 0;
}

function getTaxAmount() {

    return (
        getSubtotal() +
        getTip()
    ) * getTaxRate();
}

function getCheckoutTotal() {

    return (
        getSubtotal() +
        getTip() +
        getTaxAmount()
    );
}

function setTransactionTax(enabled) {

    transactionTaxEnabled =
        enabled;

    /*
        Redraw the current checkout screen.
        This is safe because all checkout state
        is stored in variables/cart.
    */

    productSelection();
}


/* =========================================================
   PIN
========================================================= */

async function hashPIN(pin) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(pin);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(
                hashBuffer
            )
        );

    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");
}

async function checkPIN(
    card,
    pin
) {

    if (
        !card ||
        !card.pinHash
    ) {
        return false;
    }

    const enteredHash =
        await hashPIN(pin);

    return enteredHash ===
        card.pinHash;
}

function validPIN(pin) {

    return /^\d{4}$/.test(pin);
}


/* =========================================================
   MAIN MENU
========================================================= */

function showMenu() {

    currentView =

function addItem(productId) {

    const existing =
        cart.find(
            item =>
                !item.custom &&
                item.productId ===
                productId
        );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            productId,

            quantity: 1,

            custom: false
        });
    }

    productSelection();
}

/* =========================================================
   CART QUANTITY
========================================================= */

function changeCartItem(
    productId,
    isCustom,
    amount
) {

    const custom =
        isCustom === true ||
        isCustom === "true";

    const item =
        cart.find(
            item =>
                item.productId ===
                    productId &&
                Boolean(item.custom) ===
                    custom
        );

    if (!item)
        return;

    item.quantity += amount;

    if (
        item.quantity <= 0
    ) {

        cart =
            cart.filter(
                other =>
                    !(
                        other === item
                    )
            );
    }

    productSelection();
}

async function startQRScanner() {

    if (
        scannerLocked
    )
        return;

    stopQRScanner();

    const reader =
        document.getElementById(
            "qr-reader"
        );

    if (!reader)
        return;

    const status =
        document.getElementById(
            "scanStatus"
        );

    status.textContent =
        "Starting camera...";

    qrScanner =
        new Html5Qrcode(
            "qr-reader"
        );

    try {

        const cameras =
            await Html5Qrcode.getCameras();

        if (
            !cameras ||
            cameras.length === 0
        ) {

            status.textContent =
                "No camera found. Use the manual code.";

            status.className =
                "scan-status scan-error";

            return;
        }

        let cameraId =
            cameras[0].id;

        const backCamera =
            cameras.find(
                camera =>
                    /back|rear|environment/i
                        .test(
                            camera.label
                        )
            );

        if (backCamera) {

            cameraId =
                backCamera.id;
        }

        await qrScanner.start(

            cameraId,

            {
                fps: 10,

                qrbox:
                    function(
                        width,
                        height
                    ) {

                        const size =
                            Math.min(
                                width,
                                height
                            ) * .70;

                        return {
                            width:
                                Math.floor(
                                    size
                                ),

                            height:
                                Math.floor(
                                    size
                                )
                        };
                    },

                aspectRatio: 1
            },

            decodedText => {

                handleScannedCode(
                    decodedText
                );
            },

            () => {}

        );

        status.textContent =
            "📷 Point the camera at the card QR code.";

    } catch(error) {

        console.error(error);

        status.textContent =
            "Camera could not start. Allow camera access or use the manual code.";

        status.className =
            "scan-status scan-error";
    }
}

function stopQRScanner() {

    if (!qrScanner)
        return;

    try {

        qrScanner.stop()
            .then(() => {

                try {
                    qrScanner.clear();
                } catch(e) {}

                qrScanner =
                    null;

            })
            .catch(() => {

                qrScanner =
                    null;

            });

    } catch(e) {

        qrScanner =
            null;
    }
}

function handleScannedCode(
    decodedText
) {

    if (
        scannerLocked
    )
        return;

    scannerLocked =
        true;

    stopQRScanner();

    findCard(decodedText);
}

function manualScan() {

    const code =
        document.getElementById(
            "manualCode"
        ).value.trim();

    if (!code) {

        alert(
            "Enter a card code."
        );

        return;
    }

    scannerLocked =
        true;

    stopQRScanner();

    findCard(code);
}

async function scanImageInstead() {

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "file";

    input.accept =
        "image/*";

    input.onchange =
        async function() {

            if (
                !input.files.length
            )
                return;

            try {

                const scanner =
                    new Html5Qrcode(
                        "qr-reader"
                    );

                const decodedText =
                    await scanner.scanFile(
                        input.files[0],
                        true
                    );

                scanner.clear();

                handleScannedCode(
                    decodedText
                );

            } catch(error) {

                alert(
                    "I couldn't find a QR code in that picture."
                );
            }
        };

    input.click();
}


/* =========================================================
   FIND CARD
========================================================= */

function findCard(
    decodedText
) {

    const raw =
        String(
            decodedText || ""
        ).trim();

    const normalized =
        normalizeQR(raw);

    let card =
        cards.find(
            card =>
                normalizeQR(
                    card.code
                ) ===
                normalized
        );

    if (!card) {

        card =
            cards.find(
                card =>
                    normalizeQR(
                        card.name
                    ) ===
                    normalized
            );
    }

    if (!card) {

        try {

            const url =
                new URL(raw);

            const possibleValues = [

                url.searchParams.get(
                    "card"
                ),

                url.searchParams.get(
                    "code"
                ),

                url.searchParams.get(
                    "id"
                )
            ];

            for (
                const value
                of possibleValues
            ) {

                if (!value)
                    continue;

                const valueNormalized =
                    normalizeQR(
                        value
                    );

                card =
                    cards.find(
                        c =>
                            normalizeQR(
                                c.code
                            ) ===
                            valueNormalized
                    );

                if (card)
                    break;
            }

        } catch(e) {}
    }

    if (!card) {

        scannerLocked =
            false;

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="screen">

                <h2>
                    ❌ Card Not Found
                </h2>

                <p
                    style="
                        text-align:center
                    "
                >

                    The QR code was read,
                    but it doesn't match a card.

                </p>

                <div class="card-box">

                    <strong>
                        QR data:
                    </strong>

                    <br><br>

                    <code>
                        ${escapeHTML(
                            raw
                        )}
                    </code>

                </div>

                <button
                    class="primary full"
                    onclick="
                        showCardScanner()
                    ">

                    ← Scan Again

                </button>

            </div>
        `;

        return;
    }

    currentCard =
        card;

    if (
        !currentCard.pinHash
    ) {

        setupExistingCardPIN(
            currentCard
        );

        return;
    }

    cardPINScreen();
}

function calculateTaxForTransaction(
    baseAmount,
    buyerCard,
    recipientCard
) {

    /*
        The transaction's No Tax / Tax choice
        is respected here too.
    */

    const buyerTaxRate =
        transactionTaxEnabled
        ? 0.08
        : 0;

    const recipientTaxRate =
        0;

    const buyerTax =
        baseAmount *
        buyerTaxRate;

    const recipientTax =
        0;

    const buyerPays =
        baseAmount +
        buyerTax;

    const recipientGets =
        baseAmount;

    return {

        baseAmount,

        buyerTaxRate,

        recipientTaxRate,

        buyerTax,

        recipientTax,

        buyerPays,

        recipientGets
    };
}

========================================================= */

function finishTransfer() {

    const normalTotal =
        getSubtotal() +
        getTip();

    let recipient =
        null;

    let taxInfo = {

        baseAmount:
            normalTotal,

        buyerTaxRate:
            transactionTaxEnabled
            ? 0.08
            : 0,

        recipientTaxRate:
            0,

        buyerTax:
            getTaxAmount(),

        recipientTax:
            0,

        buyerPays:
            getCheckoutTotal(),

        recipientGets:
            normalTotal
    };


    if (
        selectedTransferCard !==
        null
    ) {

        recipient =
            cards.find(
                card =>
                    card.id ===
                    selectedTransferCard
            );

        if (!recipient) {

            alert(
                "Recipient card not found."
            );

            return;
        }

        taxInfo =
            calculateTaxForTransaction(
                normalTotal,
                currentCard,
                recipient
            );

        recipient.balance +=
            taxInfo.recipientGets;
    }


    const amountCharged =
        recipient
        ? taxInfo.buyerPays
        : getCheckoutTotal();


    transactions.unshift({

        id:
            Date.now(),

        customerCard:
            currentCard.name,

        customerCode:
            currentCard.code,

        amount:
            amountCharged,

        subtotal:
            getSubtotal(),

        tip:
            getTip(),

        normalAmount:
            normalTotal,

        taxEnabled:
            transactionTaxEnabled,

        taxRate:
            transactionTaxEnabled
            ? 0.08
            : 0,

        buyerTax:
            recipient
            ? taxInfo.buyerTax
            : getTaxAmount(),

        recipientTax:
            recipient
            ? taxInfo.recipientTax
            : 0,

        recipientAmount:
            recipient
            ? taxInfo.recipientGets
            : null,

        recipient:
            recipient
            ? recipient.name
            : null,

        time:
            new Date().toLocaleString(),

        items:
            cart.map(
                item => {

                    const info =
                        getCartItemInfo(
                            item
                        );

                    return {

                        name:
                            info.name,

                        quantity:
                            item.quantity,

                        price:
                            info.price,

                        custom:
                            Boolean(
                                item.custom
                            )
                    };
                }
            )
    });


    save();


    transferChoice =
        null;

    selectedTransferCard =
        null;


    finishScreen(
        amountCharged,
        recipient,
        taxInfo
    );
}

async function createCard() {

    const name =
        document.getElementById(
            "cardName"
        ).value.trim();

    const code =
        document.getElementById(
            "cardCode"
        ).value.trim();

    const balance =
        Number(
            document.getElementById(
                "cardBalance"
            ).value
        );

    const pin =
        document.getElementById(
            "cardPIN"
        ).value;

    if (
        !name ||
        !code ||
        isNaN(balance)
    ) {

        alert(
            "Fill out all fields."
        );

        return;
    }

    if (
        !validPIN(pin)
    ) {

        alert(
            "PIN must be exactly 4 digits."
        );

        return;
    }

    if (
        cards.some(
            card =>
                card.code.toLowerCase() ===
                code.toLowerCase()
        )
    ) {

        alert(
            "That card code already exists."
        );

        return;
    }

    const pinHash =
        await hashPIN(pin);

    cards.push({

async function saveChangedPIN(id) {

    const card =
        cards.find(
            c =>
                c.id === id
        );

    const oldPIN =
        document.getElementById(
            "oldPIN"
        ).value;

    const newPIN =
        document.getElementById(
            "newPIN"
        ).value;

    const confirmPIN =
        document.getElementById(
            "confirmPIN"
        ).value;

    if (
        !validPIN(oldPIN) ||
        !validPIN(newPIN)
    ) {

        alert(
            "PINs must be exactly 4 digits."
        );

        return;
    }

    const oldCorrect =
        await checkPIN(
            card,
            oldPIN
        );

    if (!oldCorrect) {

        alert(
            "Current PIN is incorrect."
        );

        return;
    }

    if (
        newPIN !== confirmPIN
    ) {

        alert(
            "New PINs don't match."
        );

        return;
    }

    card.pinHash =
        await hashPIN(newPIN);

    save();

    alert(
        "PIN changed successfully."
    );

    editCardScreen();
}

function deleteCard(id) {

        )

    cards =

        );

    save();

    editCardScreen();
}

                                    )}

                                    )}

                                ${money(

                                )}

                            </div>

                        `
                    ).join("")
                }

            </div>

            <button
                class="primary full"
                onclick="
                    printSelectedQRs()
                ">

                🖨️ PRINT SELECTED QR CODES

            </button>

        </div>
    `;


    cards.forEach(
        card => {

            new QRCode(

                document.getElementById(
                    "qr-preview-" +
                    card.id
                ),

                {
                    text:
                        card.code,

                    width: 90,

                    height: 90,

                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );
        }
    );

    updateSelectedCount();
}

function toggleQR(id) {

    const checkbox =
        document.querySelector(
            `input[type="checkbox"][value="${id}"]`
        );

    if (
        checkbox.checked
    ) {

        selectedQRs.add(
            id
        );

    } else {

        selectedQRs.delete(
            id
        );
    }

    updateQRVisual(
        id
    );

    updateSelectedCount();
}

function updateQRVisual(id) {

    const element =
        document.getElementById(
            "qr-select-" +
            id
        );

    const checkbox =
        element.querySelector(
            "input"
        );

    element.classList.toggle(
        "selected",
        checkbox.checked
    );
}

function selectAllQRs() {

    selectedQRs =
        new Set(
            cards.map(
                card =>
                    card.id
            )
        );

    document
        .querySelectorAll(
            "#qrSelectionList input"
        )
        .forEach(
            checkbox =>
                checkbox.checked =
                    true
        );

    cards.forEach(
        card =>
            updateQRVisual(
                card.id
            )
    );

    updateSelectedCount();
}

function deselectAllQRs() {

    selectedQRs =
        new Set();

    document
        .querySelectorAll(
            "#qrSelectionList input"
        )
        .forEach(
            checkbox =>
                checkbox.checked =
                    false
        );

    cards.forEach(
        card =>
            updateQRVisual(
                card.id
            )
    );

    updateSelectedCount();
}

function updateSelectedCount() {

    const element =
        document.getElementById(
            "selectedCount"
        );

    if (!element)
        return;

    const count =
        selectedQRs.size;

    element.textContent =
        count +
        (
            count === 1
            ? " card selected"
            : " cards selected"
        );
}


/* =========================================================
   PRINT QR
========================================================= */

function printSelectedQRs() {

    if (
        selectedQRs.size === 0
    ) {

        alert(
            "Select at least one QR code."
        );

        return;
    }

    const printArea =
        document.getElementById(
            "printArea"
        );

    const selectedCards =
        cards.filter(
            card =>
                selectedQRs.has(
                    card.id
                )
        );

    printArea.innerHTML =
        "";

    const sheet =
        document.createElement(
            "div"
        );

    sheet.className =
        "print-sheet";

    printArea.appendChild(
        sheet
    );

    selectedCards.forEach(
        card => {

            const cardElement =
                document.createElement(
                    "div"
                );

            cardElement.className =
                "print-card";

            cardElement.id =
                "print-qr-" +
                card.id;

            sheet.appendChild(
                cardElement
            );
        }
    );

    selectedCards.forEach(
        card => {

            const container =
                document.getElementById(
                    "print-qr-" +
                    card.id
                );

            new QRCode(
                container,
                {
                    text:
                        card.code,

                    width: 500,

                    height: 500,

                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );
        }
    );

    let attempts = 0;

    function waitForQRCodes() {

        attempts++;

        const qrElements =
            printArea.querySelectorAll(
                ".print-card canvas, .print-card img"
            );

        if (
            qrElements.length ===
            selectedCards.length
        ) {

            requestAnimationFrame(
                () => {

                    requestAnimationFrame(
                        () => {

                            window.print();

                        }
                    );
                }
            );

            return;
        }

        if (
            attempts >= 50
        ) {

            alert(
                "The QR codes took too long to generate. Please try again."
            );

            return;
        }

        setTimeout(
            waitForQRCodes,
            100
        );
    }

    waitForQRCodes();
}
