<script>

/* =========================================================
   DATA

const SUPABASE_URL = "https://vzbniexghluuqwtgxwii.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_AF_6QkPOP6OBPCANPhhTEw_h5-HpMGJ";

const supabaseClient = supabase.createClient(

);

const defaultProducts = [

let products = [];
let cards = [];

========================================================= */

cards.forEach(card => {

/* =========================================================
   STORAGE
========================================================= */

async function loadData() {

    const { data, error } =
        await supabaseClient
            .from("cash_register_state")
            .select("*")
            .eq("id", 1)
            .maybeSingle();

    if (error) {
        console.error("Supabase load error:", error);
        alert(
            "Could not load data from Supabase. " +
            "Check your table and RLS policies."
        );
        return false;
    }

    if (!data) {
        products = structuredClone(defaultProducts);
        cards = structuredClone(defaultCards);
        transactions = [];

        return await save();
    }

    products =
        Array.isArray(data.products)
        ? data.products
        : structuredClone(defaultProducts);

    cards =
        Array.isArray(data.cards)
        ? data.cards
        : structuredClone(defaultCards);

    transactions =
        Array.isArray(data.transactions)
        ? data.transactions
        : [];

    cards.forEach(card => {
        if (typeof card.taxed !== "boolean") {
            card.taxed = false;
        }
    });

    return true;
}

async function save() {

    const { error } =
        await supabaseClient
            .from("cash_register_state")
            .upsert(
                {
                    id: 1,
                    products,
                    cards,
                    transactions,
                    updated_at: new Date().toISOString()
                },
                {
                    onConflict: "id"
                }
            );

    if (error) {
        console.error("Supabase save error:", error);
        alert("Could not save to Supabase: " + error.message);
        return false;
    }

    return true;
}


/* =========================================================
   HELPERS
========================================================= */

function money(value) {

    return "$" +
        Number(value).toFixed(2);
}

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function normalizeQR(value) {

    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/[^A-Z0-9]/g, "");
}

function getSubtotal() {

    return cart.reduce(
        (total, item) => {

            const product =
                products.find(
                    p =>
                        p.id ===
                        item.productId
                );

            if (!product)
                return total;

            return total +
                product.price *
                item.quantity;

        },
        0
    );
}

function getTip() {

    const subtotal =
        getSubtotal();

    if (selectedTipPercent > 0) {

        return subtotal *
            selectedTipPercent /
            100;
    }

    return Number(customTip) || 0;
}


/* =========================================================
   TAX
========================================================= */

function calculateTaxForTransaction(
    baseAmount,
    buyerCard,
    recipientCard
) {

    const buyerTaxed =
        !!(
            buyerCard &&
            buyerCard.taxed
        );

    const recipientTaxed =
        !!(
            recipientCard &&
            recipientCard.taxed
        );

    let buyerTaxRate = 0;
    let recipientTaxRate = 0;

    if (
        buyerTaxed &&
        recipientTaxed
    ) {

        buyerTaxRate = 0.04;
        recipientTaxRate = 0.04;

    } else if (buyerTaxed) {

        buyerTaxRate = 0.08;

    } else if (recipientTaxed) {

        recipientTaxRate = 0.08;
    }

    const buyerTax =
        baseAmount *
        buyerTaxRate;

    const recipientTax =
        baseAmount *
        recipientTaxRate;

    const buyerPays =
        baseAmount +
        buyerTax;

    const recipientGets =
        baseAmount -
        recipientTax;

    return {
        baseAmount,
        buyerTaxRate,
        recipientTaxRate,
        buyerTax,
        recipientTax,
        buyerPays,
        recipientGets
    };
}

function getCheckoutTotal() {

    const normalTotal =
        getSubtotal() +
        getTip();

    if (!currentCard) {
        return normalTotal;
    }

    if (currentCard.taxed) {
        return normalTotal * 1.08;
    }

    return normalTotal;
}


/* =========================================================
   PIN
========================================================= */

async function hashPIN(pin) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(pin);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(
                hashBuffer
            )
        );

    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");
}

async function checkPIN(card, pin) {

    if (
        !card ||
        !card.pinHash
    ) {
        return false;
    }

    const enteredHash =
        await hashPIN(pin);

    return enteredHash ===
        card.pinHash;
}

function validPIN(pin) {

    return /^\d{4}$/.test(pin);
}

function addItem(productId) {

    const existing =
        cart.find(
            item =>
                item.productId ===
                productId
        );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            productId,
            quantity: 1
        });
    }

    productSelection();
}

function changeItem(
    productId,
    amount
) {

    const item =
        cart.find(
            item =>
                item.productId ===
                productId
        );

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(
                item =>
                    item.productId !==
                    productId
            );
    }

    productSelection();
}

function clearSale() {

    if (cart.length === 0)
        return;

    if (!confirm(
        "Clear all items from this sale?"
    )) return;

    cart = [];

    selectedTipPercent = 0;
    customTip = 0;

    productSelection();
}

async function startQRScanner() {

    if (scannerLocked)
        return;

    stopQRScanner();

    const reader =
        document.getElementById(
            "qr-reader"
        );

    if (!reader) return;

    const status =
        document.getElementById(
            "scanStatus"
        );

    status.textContent =
        "Starting camera...";

    qrScanner =
        new Html5Qrcode(
            "qr-reader"
        );

    try {

        const cameras =
            await Html5Qrcode.getCameras();

        if (
            !cameras ||
            cameras.length === 0
        ) {

            status.textContent =
                "No camera found. Use the manual code.";

            status.className =
                "scan-status scan-error";

            return;
        }

        let cameraId =
            cameras[0].id;

        const backCamera =
            cameras.find(
                camera =>
                    /back|rear|environment/i
                    .test(
                        camera.label
                    )
            );

        if (backCamera) {

            cameraId =
                backCamera.id;
        }

        await qrScanner.start(

            cameraId,

            {
                fps: 10,

                qrbox:
                    function(
                        width,
                        height
                    ) {

                        const size =
                            Math.min(
                                width,
                                height
                            ) * .70;

                        return {
                            width:
                                Math.floor(size),
                            height:
                                Math.floor(size)
                        };
                    },

                aspectRatio: 1
            },

            decodedText => {

                handleScannedCode(
                    decodedText
                );
            },

            () => {}

        );

        status.textContent =
            "📷 Point the camera at the card QR code.";

    } catch(error) {

        console.error(error);

        status.textContent =
            "Camera could not start. Allow camera access or use the manual code.";

        status.className =
            "scan-status scan-error";
    }
}

function stopQRScanner() {

    if (!qrScanner)
        return;

    try {

        qrScanner.stop()
            .then(() => {

                try {
                    qrScanner.clear();
                } catch(e) {}

                qrScanner = null;

            })
            .catch(() => {

                qrScanner = null;

            });

    } catch(e) {

        qrScanner = null;
    }
}

function handleScannedCode(
    decodedText
) {

    if (scannerLocked)
        return;

    scannerLocked = true;

    stopQRScanner();

    findCard(decodedText);
}

function manualScan() {

    const code =
        document.getElementById(
            "manualCode"
        ).value.trim();

    if (!code) {

        alert(
            "Enter a card code."
        );

        return;
    }

    scannerLocked = true;

    stopQRScanner();

    findCard(code);
}

async function scanImageInstead() {

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";
    input.accept = "image/*";

    input.onchange =
        async function() {

            if (!input.files.length)
                return;

            try {

                const scanner =
                    new Html5Qrcode(
                        "qr-reader"
                    );

                const decodedText =
                    await scanner.scanFile(
                        input.files[0],
                        true
                    );

                scanner.clear();

                handleScannedCode(
                    decodedText
                );

            } catch(error) {

                alert(
                    "I couldn't find a QR code in that picture."
                );
            }
        };

    input.click();
}


/* =========================================================
   FIND CARD
========================================================= */

function findCard(decodedText) {

    const raw =
        String(decodedText || "")
        .trim();

    const normalized =
        normalizeQR(raw);

    let card =
        cards.find(
            card =>
                normalizeQR(
                    card.code
                ) === normalized
        );

    if (!card) {

        card =
            cards.find(
                card =>
                    normalizeQR(
                        card.name
                    ) === normalized
            );
    }

    if (!card) {

        try {

            const url =
                new URL(raw);

            const possibleValues = [

                url.searchParams.get(
                    "card"
                ),

                url.searchParams.get(
                    "code"
                ),

                url.searchParams.get(
                    "id"
                )
            ];

            for (
                const value
                of possibleValues
            ) {

                if (!value)
                    continue;

                const valueNormalized =
                    normalizeQR(value);

                card =
                    cards.find(
                        c =>
                            normalizeQR(
                                c.code
                            ) ===
                            valueNormalized
                    );

                if (card)
                    break;
            }

        } catch(e) {}
    }

    if (!card) {

        scannerLocked = false;

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="screen">

                <h2>
                    ❌ Card Not Found
                </h2>

                <p style="text-align:center">

                    The QR code was read, but it
                    doesn't match a card.

                </p>

                <div class="card-box">

                    <strong>
                        QR data:
                    </strong>

                    <br><br>

                    <code>
                        ${escapeHTML(raw)}
                    </code>

                </div>

                <button
                    class="primary full"
                    onclick="showCardScanner()">

                    ← Scan Again

                </button>

            </div>
        `;

        return;
    }

    currentCard = card;

    if (!currentCard.pinHash) {

        setupExistingCardPIN(
            currentCard
        );

        return;
    }

    cardPINScreen();
}

async function verifyTransferPIN() {

    const recipient =
        cards.find(
            card =>
                card.id ===
                selectedTransferCard
        );

    if (!recipient)
        return;

    const pin =
        document.getElementById(
            "transferPIN"
        ).value;

    if (!validPIN(pin)) {

        alert(
            "Enter the 4-digit PIN."
        );

        return;
    }

    const correct =
        await checkPIN(
            recipient,
            pin
        );

    if (!correct) {

        alert(
            "Incorrect recipient PIN."
        );

        document.getElementById(
            "transferPIN"
        ).value = "";

        return;
    }

    transferChoice =
        "card";

    finishTransfer();
}


/* =========================================================
   FINISH SALE
========================================================= */

function finishTransfer() {

    const normalTotal =
        getSubtotal() +
        getTip();

    let recipient = null;

    let taxInfo = {

        baseAmount:
            normalTotal,

        buyerTaxRate: 0,

        recipientTaxRate: 0,

        buyerTax: 0,

        recipientTax: 0,

        buyerPays:
            normalTotal,

        recipientGets:
            normalTotal
    };

    if (
        selectedTransferCard !==
        null
    ) {

        recipient =
            cards.find(
                card =>
                    card.id ===
                    selectedTransferCard
            );

        if (!recipient) {

            alert(
                "Recipient card not found."
            );

            return;
        }

        taxInfo =
            calculateTaxForTransaction(
                normalTotal,
                currentCard,
                recipient
            );

        recipient.balance +=
            taxInfo.recipientGets;
    }

    const amountCharged =
        recipient
        ? taxInfo.buyerPays
        : getCheckoutTotal();

    transactions.unshift({

        id: Date.now(),

        customerCard:
            currentCard.name,

        customerCode:
            currentCard.code,

        amount:
            amountCharged,

        subtotal:
            getSubtotal(),

        tip:
            getTip(),

        normalAmount:
            normalTotal,

        buyerTax:
            recipient
            ? taxInfo.buyerTax
            :
            (
                currentCard.taxed
                ? normalTotal * 0.08
                : 0
            ),

        recipientTax:
            recipient
            ? taxInfo.recipientTax
            : 0,

        recipientAmount:
            recipient
            ? taxInfo.recipientGets
            : null,

        recipient:
            recipient
            ? recipient.name
            : null,

        time:
            new Date().toLocaleString(),

        items:
            cart.map(item => {

                const product =
                    products.find(
                        p =>
                            p.id ===
                            item.productId
                    );

                return {

                    name:
                        product.name,

                    quantity:
                        item.quantity
                };
            })
    });

    save();

    transferChoice = null;
    selectedTransferCard = null;

    finishScreen(
        amountCharged,
        recipient,
        taxInfo
    );
}

/* =========================================================
   FIXED QR PRINT FUNCTION
========================================================= */

function printSelectedQRs() {

    if (
        selectedQRs.size === 0
    ) {

        alert(
            "Select at least one QR code."
        );

        return;
    }

    const printArea =
        document.getElementById(
            "printArea"
        );

    const selectedCards =
        cards.filter(
            card =>
                selectedQRs.has(
                    card.id
                )
        );

    /*
        Clear previous print content.
    */

    printArea.innerHTML = "";

    /*
        Create the exact Letter-size
        print sheet.
    */

    const sheet =
        document.createElement(
            "div"
        );

    sheet.className =
        "print-sheet";

    printArea.appendChild(
        sheet
    );

    /*
        Create one container for
        every selected QR code.
    */

    selectedCards.forEach(
        card => {

            const cardElement =
                document.createElement(
                    "div"
                );

            cardElement.className =
                "print-card";

            cardElement.id =
                "print-qr-" +
                card.id;

            sheet.appendChild(
                cardElement
            );
        }
    );

    /*
        Generate the QR codes.
    */

    selectedCards.forEach(
        card => {

            const container =
                document.getElementById(
                    "print-qr-" +
                    card.id
                );

            new QRCode(
                container,
                {
                    text:
                        card.code,

                    width: 500,

                    height: 500,

                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );
        }
    );

    /*
        Wait until every QRCode.js canvas
        actually exists before printing.
    */

    let attempts = 0;

    function waitForQRCodes() {

        attempts++;

        const qrElements =
            printArea.querySelectorAll(
                ".print-card canvas, .print-card img"
            );

        if (
            qrElements.length ===
            selectedCards.length
        ) {

            /*
                Force the browser to perform
                layout/paint before print.
            */

            requestAnimationFrame(
                () => {

                    requestAnimationFrame(
                        () => {

                            window.print();

                        }
                    );

                }
            );

            return;
        }

        /*
            Give up after 5 seconds.
        */

        if (attempts >= 50) {

            alert(
                "The QR codes took too long to generate. Please try again."
            );

            return;
        }

        setTimeout(
            waitForQRCodes,
            100
        );
    }

    waitForQRCodes();
}

                ← Main Menu

            </button>

            <h2>
                📦 Product Management
            </h2>

            <div class="option">

                <h3>
                    ➕ Add Product
                </h3>

                <button
                    class="green full"
                    onclick="
                        addProductScreen()
                    ">

                    Add Product

                </button>

            </div>

            <div class="option">

                <h3>
                    ✏️ Edit Products
                </h3>

                <button
                    class="primary full"
                    onclick="
                        editProductsScreen()
                    ">

                    Edit Products

                </button>

            </div>

        </div>
    `;
}

function addProductScreen() {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <button
                class="gray back"
                onclick="productMenu()">

                ← Product Menu

            </button>

            <h2>
                Add Product
            </h2>

            <label>
                Product Name
            </label>

            <input
                id="productName"
                placeholder="Candy">

            <label>
                Price
            </label>

            <input
                id="productPrice"
                type="number"
                min="0"
                step=".01"
                placeholder="2.50">

            <button
                class="green full"
                onclick="addProduct()">

                Add Product

            </button>

        </div>
    `;
}

function addProduct() {

    const name =
        document.getElementById(
            "productName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );

    if (
        !name ||
        isNaN(price)
    ) {

        alert(
            "Enter a valid product."
        );

        return;
    }

    products.push({

        id: Date.now(),

        name,

        price
    });

    save();

    alert(
        "Product added!"
    );

    productMenu();
}

function editProductsScreen() {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <button
                class="gray back"
                onclick="productMenu()">

                ← Product Menu

            </button>

            <h2>
                Edit Products
            </h2>

            ${
                products.map(
                    product => `

                        <div class="option">

                            <strong>
                                ${escapeHTML(
                                    product.name
                                )}
                            </strong>

                            <br><br>

                            ${money(
                                product.price
                            )}

                            <br><br>

                            <button
                                class="primary"
                                onclick="
                                    editProduct(
                                        ${product.id}
                                    )
                                ">

                                Edit

                            </button>

                            <button
                                class="red"
                                onclick="
                                    deleteProduct(
                                        ${product.id}
                                    )
                                ">

                                Delete

                            </button>

                        </div>

                    `
                ).join("")
            }

        </div>
    `;
}

function editProduct(id) {

    const product =
        products.find(
            product =>
                product.id === id
        );

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <button
                class="gray back"
                onclick="
                    editProductsScreen()
                ">

                ← Products

            </button>

            <h2>
                Edit Product
            </h2>

            <label>
                Name
            </label>

            <input
                id="editProductName"
                value="${escapeHTML(
                    product.name
                )}">

            <label>
                Price
            </label>

            <input
                id="editProductPrice"
                type="number"
                step=".01"
                value="${product.price}">

            <button
                class="primary full"
                onclick="
                    saveProduct(
                        ${id}
                    )
                ">

                Save

            </button>

        </div>
    `;
}

function saveProduct(id) {

    const product =
        products.find(
            product =>
                product.id === id
        );

    product.name =
        document.getElementById(
            "editProductName"
        ).value.trim();

    product.price =
        Number(
            document.getElementById(
                "editProductPrice"
            ).value
        );

    save();

    editProductsScreen();
}

function deleteProduct(id) {

    if (!confirm(
        "Delete this product?"
    ))
        return;

    products =
        products.filter(
            product =>
                product.id !== id
        );

    save();

    editProductsScreen();
}


/* =========================================================
   HISTORY
========================================================= */

function historyScreen() {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="screen">

            <button
                class="gray back"
                onclick="showMenu()">

                ← Main Menu

            </button>

            <h2>
                📋 Transaction History
            </h2>

            ${
                transactions.length === 0

                ?

                `<div class="empty">
                    No transactions yet.
                </div>`

                :

                transactions.map(
                    transaction => `

                        <div
                            class="history"
                            id="
                                transaction-${transaction.id}
                            ">

                            <strong>
                                ${escapeHTML(
                                    transaction.customerCard
                                )}
                            </strong>

                            <br>

                            ${escapeHTML(
                                transaction.time
                            )}

                            <br><br>

                            Normal amount:
                            ${money(
                                transaction.normalAmount ??
                                transaction.amount
                            )}

                            <br>

                            Subtotal:
                            ${money(
                                transaction.subtotal
                            )}

                            <br>

                            Tip:
                            ${money(
                                transaction.tip
                            )}

                            ${
                                transaction.buyerTax > 0
                                ?
                                `
                                <br>
                                Buyer tax:
                                ${money(
                                    transaction.buyerTax
                                )}
                                `
                                :
                                ""
                            }

                            ${
                                transaction.recipientTax > 0
                                ?
                                `
                                <br>
                                Recipient tax:
                                ${money(
                                    transaction.recipientTax
                                )}
                                `
                                :
                                ""
                            }

                            <br>

                            <strong>
                                Total charged:
                                ${money(
                                    transaction.amount
                                )}
                            </strong>

                            <br><br>

                            Money went to:

                            <strong>
                                ${
                                    transaction.recipient
                                    ?
                                    escapeHTML(
                                        transaction.recipient
                                    )
                                    :
                                    "No one"
                                }
                            </strong>

                            <br><br>

                            <strong>
                                Items:
                            </strong>

                            <br>

                            ${
                                transaction.items
                                .map(
                                    item =>
                                        `${escapeHTML(
                                            item.name
                                        )}
                                        ×
                                        ${item.quantity}`
                                )
                                .join("<br>")
                            }

                            <button
                                class="
                                    red
                                    full
                                    history-delete
                                "
                                onclick="
                                    deleteTransaction(
                                        ${transaction.id}
                                    )
                                ">

                                🗑 Delete This Transaction

                            </button>

                        </div>

                    `
                ).join("")
            }

            ${
                transactions.length > 0
                ?
                `

                <br>

                <button
                    class="red full"
                    onclick="
                        clearHistory()
                    ">

                    🗑 Delete ALL Transactions

                </button>

                `
                :
                ""
            }

        </div>
    `;
}

function deleteTransaction(id) {

    const transaction =
        transactions.find(
            transaction =>
                transaction.id === id
        );

    if (!transaction)
        return;

    if (!confirm(
        "Delete this transaction from history?"
    )) {
        return;
    }

    transactions =
        transactions.filter(
            transaction =>
                transaction.id !== id
        );

    save();

    historyScreen();
}

function clearHistory() {

    if (!confirm(
        "Delete ALL fake transaction history?"
    )) {
        return;
    }

    transactions = [];

    save();

    historyScreen();
}


/* =========================================================
   START
========================================================= */

async function initializeApp() {

    document.getElementById("app").innerHTML = `
        <div class="screen">
            <h2>Loading...</h2>
        </div>
    `;

    await loadData();
    showMenu();
}

initializeApp();

</script>
